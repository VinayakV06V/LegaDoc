version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      react:
        patterns:
          - "react*"
      vite:
        patterns:
          - "vite*"
          - "@vitejs/*"
  - package-ecosystem: "pip"
    directory: "/api"
    schedule:
      interval: "weekly"

