version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: legadoc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build: ./api
    env_file: .env
    depends_on:
      - db
      - redis
      - minio
    ports:
      - "8000:8000"
    volumes:
      - ./api/app:/app/app

  ocr_worker:
    build: ./workers/ocr_worker
    env_file: .env
    depends_on:
      - redis
      - db
      - minio

  ai_parser_worker:
    build: ./workers/ai_parser_worker
    env_file: .env
    depends_on:
      - redis
      - db

  chain_worker:
    build: ./workers/chain_worker
    env_file: .env
    depends_on:
      - redis
      - db
    volumes:
      - ./fabric-network:/fabric-network

  web:
    build: ./web
    ports:
      - "5173:5173"
    volumes:
      - ./web/src:/app/src
    command: npm run dev -- --host

volumes:
  db_data:
  minio_data:
